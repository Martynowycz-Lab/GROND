name: Bug report
description: Report a reproducible software or numerical problem in GROND.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the command and the smallest shareable input or synthetic example that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the GROND commit or version, Python version, operating system, and the relevant `GROND doctor --probe-bloch` output.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach a short log, traceback, or numerical comparison. Do not upload private diffraction data or credentials.
    validations:
      required: true
