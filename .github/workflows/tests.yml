name: tests

on:
  # Documentation-only changes (README, citation, license) do not run the tests.
  push:
    paths-ignore: ["**.md", "CITATION.cff", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "CITATION.cff", "LICENSE"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest
      - run: python -m grond doctor
