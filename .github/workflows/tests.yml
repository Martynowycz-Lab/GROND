name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint package and release scripts
        run: python -m ruff check src/grond tests scripts --no-cache
      - name: Test
        run: python -m pytest
      - name: Validate package metadata
        run: python -m grond validate
      - name: Doctor
        run: python -m grond doctor --probe-bloch
      - name: Build and inspect release artifacts
        if: matrix.python-version == '3.12'
        run: |
          python -m build --sdist --wheel --outdir dist-check
          python scripts/check_release_artifacts.py dist-check
          python scripts/smoke_install_wheel.py dist-check
