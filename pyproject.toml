[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grond"
version = "0.2.2"
description = "Global Regularization Of Non-kinematical Diffraction for electron-diffraction data."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Martynowycz Lab"}]
keywords = ["electron diffraction", "Bloch waves", "N-beam", "XDS", "crystallography", "non-kinematical diffraction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "gemmi>=0.6,<0.8",
  "numpy>=1.26,<2.6",
  "pandas>=2.0,<3",
  "scipy>=1.11,<1.18",
]

[project.urls]
Homepage = "https://github.com/Martynowycz-Lab/GROND"
Documentation = "https://github.com/Martynowycz-Lab/GROND/tree/main/docs"
Repository = "https://github.com/Martynowycz-Lab/GROND"
Issues = "https://github.com/Martynowycz-Lab/GROND/issues"
Changelog = "https://github.com/Martynowycz-Lab/GROND/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "build>=1.2"]
config = ["PyYAML>=6"]
raw = ["fabio>=2024.0"]

[project.scripts]
grond = "grond.cli:main"
GROND = "grond.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grond = ["legacy/**/*.py", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# h, k, l and I are conventional crystallographic symbols in the numerical engine.
# E402 keeps BLAS thread limits ahead of NumPy/SciPy imports. Optimizer callbacks
# covered by B023 are consumed synchronously before their enclosing loop advances.
"src/grond/legacy/engine/bloch_engine.py" = ["E402", "E741"]
"src/grond/legacy/engine/build_dynrows_xds.py" = ["E741"]
"src/grond/legacy/engine/dynrow_contract.py" = ["E741"]
"src/grond/legacy/engine/native_multi_structure_update.py" = ["B023", "E402"]
"src/grond/legacy/engine/native_observation_polish_endpoint.py" = ["E741"]
"src/grond/legacy/engine/native_row_regularize.py" = ["E402", "E741"]
"src/grond/legacy/engine/native_sigma_replicate_audit.py" = ["E741"]
"src/grond/legacy/engine/native_structure_update.py" = ["B023", "E402", "E741"]
"src/grond/legacy/engine/native_two_part_observation_correction.py" = ["E741"]
"src/grond/legacy/engine/post_bloch_sigma.py" = ["E741"]
"src/grond/legacy/engine/premerge_rfactor_audit.py" = ["E741"]
"src/grond/legacy/engine/row_mr_report.py" = ["E741"]
"src/grond/legacy/engine/scale_contract_replay.py" = ["E741"]
"src/grond/legacy/engine/support_basis_scan.py" = ["E402"]
"src/grond/legacy/engine/xds_raw_profile_integrator.py" = ["E741"]
